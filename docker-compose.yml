services:
  db:
    image: postgres:16-alpine
    container_name: hrbi-db
    environment:
      POSTGRES_DB: hrbi
      POSTGRES_USER: hrbi
      POSTGRES_PASSWORD: hrbi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrbi -d hrbi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: hrbi-backend
    environment:
      DATABASE_URL: postgresql://hrbi:hrbi@db:5432/hrbi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/sources').read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      
  frontend:
    build: ./frontend
    container_name: hrbi-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
